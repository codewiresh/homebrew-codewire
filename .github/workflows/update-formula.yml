name: Update formula

# A Codewire release dispatches this with its tag. It renders the formula from
# the release's signed SHA256SUMS, checks it with Homebrew on Linux and macOS,
# and only then commits it to main. Pushes and pull requests run the same
# checks on the committed formula, without committing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, such as v0.4.25"
        required: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-formula-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render the formula from the signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the renderer
        run: python3 -I -B scripts/test_render_formula.py

      - name: Render the dispatched release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -I -B scripts/render_formula.py render --version "$VERSION" --output Formula/codewire.rb

      - name: Check the formula is its version's signed release
        run: python3 -I -B scripts/render_formula.py check Formula/codewire.rb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: Formula/codewire.rb
          if-no-files-found: error
          retention-days: 7

  check:
    name: Homebrew checks (${{ matrix.os }})
    needs: render
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - id: brew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # main, 2026-10-30

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: ${{ steps.brew.outputs.repository-path }}/Formula

      - name: Audit, install and test
        run: |
          brew trust codewiresh/codewire
          brew audit --strict --online codewiresh/codewire/codewire
          brew install codewiresh/codewire/codewire
          brew test codewiresh/codewire/codewire

  commit:
    name: Commit the formula
    if: github.event_name == 'workflow_dispatch'
    needs: [render, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job pushes the formula with the checkout's token and uploads no artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] (v7.0.1)
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: ${{ runner.temp }}/checked

      # Render again against main as it is now, so the never-backwards check
      # sees the formula this commit replaces, and commit only if the result
      # is byte-for-byte the formula Homebrew checked.
      - name: Render again and compare with the checked formula
        env:
          VERSION: ${{ inputs.version }}
          CHECKED: ${{ runner.temp }}/checked/codewire.rb
        run: |
          python3 -I -B scripts/render_formula.py render --version "$VERSION" --output Formula/codewire.rb
          cmp Formula/codewire.rb "$CHECKED"

      - name: Commit and push only the formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          if [[ -z "$changed" ]]; then
            echo "The formula is already ${VERSION}."
            exit 0
          fi
          if [[ "$changed" != " M Formula/codewire.rb" ]]; then
            printf 'Refusing: the render changed more than Formula/codewire.rb:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "codewire ${VERSION#v}" -- Formula/codewire.rb
          # A plain push: if main moved since the render, this fails and the
          # next dispatch renders again.
          git push origin HEAD:refs/heads/main
          echo "Committed codewire ${VERSION#v}."
